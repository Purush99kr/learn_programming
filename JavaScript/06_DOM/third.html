<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DOM Learning | Part 3</title>
    <style>
      .bg {
        background-color: #2f2f2f;
        color: #fff;
      }
    </style>
  </head>
  <body class="bg"></body>
  <script>
    const div = document.createElement("div"); //create a div element
    console.log(div);
    div.className = "main"; //set class name
    div.id = Math.round(Math.random() * 10 + 1); // set id
    div.Attribute = ("title", "generated title");
    div.style.backgroundColor = "gray";
    div.style.padding = "12px";
    // div.innerText = "Purushottam Kumar Learning"
    const addText = document.createTextNode("Purushottam Kumar Learning");
    div.appendChild(addText);

    document.body.appendChild(div);

    // ++++++++++++{function creation: creating a div element}+++++++++++
    function addDiv(text, id, className, styles = {}) {
      const div = document.createElement("div"); //create a div
      const divText = document.createTextNode(text); //create a textNode to attch text
      div.appendChild(divText); //attaching text into the div element
      div.id = id;
      div.className = className;
      Object.assign(div.style, styles); // Apply styles dynamically
      document.body.appendChild(div); // attaching div element to th page by appending inside the body tag children
    }

    addDiv(
      "Purushottam Kumar Learning from dynamic functions",
      "main-div",
      "main",
      {
        backgroundColor: "red",
        color: "white",
        padding: "12px",
        borderRadius: "10px",
        fontSize: "20px",
      },
    );
  </script>
</html>
