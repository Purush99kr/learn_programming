<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Project | Text Traversal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main">
      <p id="quote">
        This is the useCase project of JavaScript Events. Click over the buttons
        to execute the events.
      </p>
      <h2 class="title">Displaying Changing Text as a clock timer</h2>
      <div id="container">
        <div id="buttons">
          <button id="start" class="start">Start</button>
          <button id="stop" class="stop">Stop</button>
          <button id="reset" class="reset">Reset</button>
        </div>
        <div id="container2">
          <div id="content">
            <h1 id="name">JavaScript is a single-threaded language !</h1>
          </div>
          <div id="log">
            <h2 class="title">
              Displaying Changing Text as a text log per sec
            </h2>
            <div id="logs"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
