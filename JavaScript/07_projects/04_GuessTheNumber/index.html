<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>DOM Project | Number Guessing</title>
  </head>
  <body class="bg">
    <br id="wrapper">
      <h1>Number Guessing Game</h1>
      <p>Try and guess a random number</p>
      <p>You have only 10 attempts to guess</p>

    </br>
    <form action="" class="form">
        <label for="guessfield" id="guess">Guess a number</label>
        <input type="text" name="guessField" id="guessField">
        <input type="submit" id="subt" vaue="Submit Guess" class="guessSubmit">
    </form>

    <div class="resultParas">
        <p>Previous Guess : <span class="guesses"></span></p>
        <p>Guesses remainig: <span class="lastResult">10</span></p>
        <p class="lowOrHi"></p>
    </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
