<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>DOM Project | BMI Calculator</title>
    <style>
      .bg {
        background-color: #9b9898;
        color: #fff;
      }
    </style>
  </head>
  <body class="bg">
    <div class="container">
      <h1 id="heading">BMI Calculator</h1>
      <form action="">
        <p>
          <label for="height">Height in CM: </label
          ><input type="text" id="height" name="height" />
        </p>
        <p>
          <lable>Weight in KG: </lable>
          <input type="text" name="weight" id="weight" />
        </p>
        <button type="submit" style="cursor: pointer">Calculate</button>
        <button type="button" id="reset" style="cursor: pointer">Reset</button>
        <div id="results"></div>
        <dir id="guide"></dir>
        <div id="weight-guide">
          <h3>BMI Weight Guide</h3>
          <p>Under Weight = Less than 18.6</p>
          <p>NOrmal Range = 18.6 - 24.9</p>
          <p>Overweight = Greator than 24.9</p>
        </div>
      </form>
    </div>
  </body>
  <script src="script.js"></script>
</html>
